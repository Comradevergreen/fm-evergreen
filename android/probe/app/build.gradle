plugins {
    id "com.android.application"
}
android {
    namespace "fm.jiant.probe"
    compileSdk 34
    defaultConfig {
        applicationId "fm.jiant.probe"
        minSdk 29                      // (MediaStore.Downloads with no storage permission)
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }
    signingConfigs {
        debug {                        // (one key for every build: a new APK installs over the last one)
            storeFile file("probe-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
