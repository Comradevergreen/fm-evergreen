// The app's audio and file logic with no Android in it: WAV in and out, the FM-1's channel layout, the stem
// splitter, the latency measure, the session, the mix and the exports. JVM unit tests: gradle :core:test
apply plugin: "org.jetbrains.kotlin.jvm"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = "17"
}
dependencies {
    testImplementation "junit:junit:4.13.2"
}
test {
    testLogging { events "passed", "failed"; exceptionFormat "full" }
}
