// JIANT Stems, the Android app: plain Android views drawn in the FM-1's look, the USB driver in C (usbstream.c,
// from JIANT Probe's), the audio logic in :core. No libraries beyond the Android SDK.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "fm.jiant.stems"
    compileSdk 34
    defaultConfig {
        applicationId "fm.jiant.stems"
        minSdk 29                      // (MediaStore and scoped storage with no storage permission)
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        debug {                        // (one key for every build, public on purpose: a new APK installs over the last)
            storeFile file("stems-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true                      // (Robolectric: the merged manifest, the assets)
            all { jvmArgs "--add-opens=java.base/java.io=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED" }
        }
    }
}

dependencies {
    implementation project(":core")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.12.2"   // the pages without a phone: app/src/test (PagesTest)
}
