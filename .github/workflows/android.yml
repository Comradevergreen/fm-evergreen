# SPDX-License-Identifier: GPL-3.0-only
# (JIANT) the Android probe (android/probe, JIANT Probe: what a phone does with the FM-1's USB audio), built on every
# push that touches it, the APK as a workflow artifact. On main the site's workflow (emulator.yml) also publishes it
# next to the installer (app/jiant-probe.apk). The JIANT Stems app is a separate product, not in this repository.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: the APK
        run: gradle -p android/probe assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jiant-probe
          path: android/probe/app/build/outputs/apk/debug/app-debug.apk
