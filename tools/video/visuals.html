<script>
/* ---------------------------------------------------------------- palette: JIANT + heat_col + the plates' inks --- */

/* one isotherm's points (bg_outline). f.m blends in a second species (f.lobB, f.spikesB, gB): the organ transforming.

function iso(g, f, cx, cy, r, outer, t, tum, nv) {

/* the organism. o.style: "thermal" (the firmware's lines), "plate" (Auzoux: pellicle, cilia, vacuoles), "pet"

    nuc.forEach(([x, y]) => { ctx.fillStyle = heat(236 + E * 20 / 256); ctx.beginPath(); ctx.arc(x, y, r * 0.13, 0, TAU); ctx.fill(); });

/* ---------------------------------------------------------------- composite: two scenes dissolve through noise; trails,

const P_COMP = prog(HEAD + NOISE + `uniform sampler2D uA;uniform sampler2D uB;uniform sampler2D uPrev;uniform float uMix;uniform float uTrail;uniform int uPal;

const P_SHOW = prog(HEAD + `uniform sampler2D uT;void main(){o=vec4(texture(uT,vUv).rgb,1.);}`);

/* half floats for the initial textures */
function toHalf(v) { const f = new Float32Array([v]), i = new Uint32Array(f.buffer)[0]; const s = (i >> 16) & 0x8000, e = ((i >> 23) & 0xff) - 112, m = i & 0x7fffff; if (e <= 0) return s; if (e >= 31) return s | 0x7c00; return s | (e << 10) | (m >> 13); }
/* ---------------------------------------------------------------- the performance: six tracks (the stems, in the app) */
const BPM = 116, STEP = 60 / BPM / 4;
const TRK = [['DRUM-X', 'X...x...X...x.x.'], ['BASS', 'x..x..x.x.x...x.'], ['PAD', 'x...............'], ['LEAD', 'x.....x...x.....'], ['ARP', 'xxx.xxx.xxx.xxx.'], ['METAL', '......x.......x.']];
const mute = [0, 0, 0, 0, 0, 0];
let playing = true, clock = 0, stepN = -1, bars = 0, soundOn = false, ext = null;
let AC = null, master = null, analyser = null, fbuf = null, fileSrc = null; const prevB = new Float32Array(6);
function audioOn() { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .35; master.connect(AC.destination); }
const CH = [[65, 68, 72], [61, 65, 68], [56, 60, 63], [63, 67, 70]], hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
function voice(k, t, bar) {
  if (!AC || !soundOn) return;
  const o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime; o.connect(g); g.connect(master);
  const env = (a, d, p) => { g.gain.setValueAtTime(1e-4, now); g.gain.exponentialRampToValueAtTime(p, now + a); g.gain.exponentialRampToValueAtTime(1e-4, now + a + d); o.start(now); o.stop(now + a + d + .05); };

  else if (k === 3) { o.type = 'square'; o.frequency.value = hz(CH[bar % 4][2] + 12); env(.01, .45, .07); }
  else if (k === 4) { o.type = 'sine'; o.frequency.value = hz(CH[bar % 4][t % 3] + 12); env(.002, .12, .08); }
  else { o.type = 'square'; o.frequency.value = 1830 + 400 * Math.random(); env(.001, .08, .05); }
}
function hit(k, v = 1) {
  S.E[k] = Math.max(S.E[k], v);
  if (k === 0) { S.hit = Math.max(S.hit, v); if (S.amt > .25) drop = [Math.random(), Math.random(), .015 + .03 * S.amt, .6]; }
}
async function loadFile(file) {
  audioOn(); const buf = await AC.decodeAudioData(await file.arrayBuffer());
  if (fileSrc) try { fileSrc.stop(); } catch (e) {}
  fileSrc = AC.createBufferSource(); fileSrc.buffer = buf; fileSrc.loop = true;
  analyser = AC.createAnalyser(); analyser.fftSize = 2048; fbuf = new Uint8Array(analyser.frequencyBinCount);

}
function fileBands() {
  analyser.getByteFrequencyData(fbuf); const nyq = AC.sampleRate / 2, bin = (f) => Math.round(f / nyq * fbuf.length);

    if (v - prevB[k] > .07) hit(k, Math.min(1, v * 1.4)); else S.E[k] = Math.max(S.E[k], v * .8); prevB[k] = v;
  });
}
/* ---------------------------------------------------------------- the styles */
const STYLES = [
  { id: 'neb', name: 'NEBULOSA', hint: 'un vuelo a través de una nube de luz: el bajo la hincha, el bombo la desgarra', trail: .5 },
  { id: 'smoke', name: 'HUMO', hint: 'miles de partículas en corrientes; cada golpe las dispara', trail: 0 },
  { id: 'rd', name: 'MEMBRANA', hint: 'una placa de Petri viva: las manchas se dividen como células (mitosis)', trail: .2 },
  { id: 'scan', name: 'BARRIDO', hint: 'un paisaje de líneas de monitor que el sonido levanta', trail: .35 },
  { id: 'orb', name: 'ÓRBITAS', hint: 'cuentas de luz sobre la órbita de cada pista', trail: .75 },
  { id: 'beings', name: 'MICROSCOPIO', hint: 'los seres del FM-1 bajo el microscopio: tres planos, el foco respirando', trail: .3 },
];
const PALS = ['TÉRMICO', 'HUMO', 'TINTA', 'CRT'];
let cur = 0, nxt = 0, mix = 0, auto = true, pal = 0, trailK = 1;
let sA, sB, comp = [], frames = 0;
function resize() {
  const d = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; HH = cv.clientHeight;
  cv.width = Math.max(2, Math.round(W * d)); cv.height = Math.max(2, Math.round(HH * d));
  const w = Math.max(2, Math.round(W * d * RS)), h = Math.max(2, Math.round(HH * d * RS));
  sA = fbo(w, h); sB = fbo(w, h); comp = [fbo(w, h, false), fbo(w, h, false)]; trail = fbo(w, h); trail2 = fbo(w, h); btex = null;
}
function scene(id, out) {
  const w = out.w, h = out.h;
  if (id === 'neb') { common(P_NEB, w, h); target(out); quad(); return out.t; }
  if (id === 'scan') { common(P_SCAN, w, h); target(out); quad(); return out.t; }
  if (id === 'orb') { common(P_ORB, w, h); target(out); quad(); return out.t; }

let last = performance.now() / 1000;
function frame(ms) {
  const now = ms / 1000, dt = Math.min(.1, now - last); last = now; S.t += dt; frames++;

      TRK.forEach((tr, k) => { if (!mute[k] && tr[1][i] !== '.' && (k !== 3 || bar % 2 === 0)) { hit(k, tr[1][i] === 'X' ? 1 : .75); voice(k, i, bar); } });
    }

}
function draw() {
  const ta = scene(STYLES[cur].id, sA), tb = cur !== nxt ? scene(STYLES[nxt].id, sB) : ta;
  const c = comp[frames & 1], p = comp[(frames + 1) & 1];
  common(P_COMP, c.w, c.h); bindT(0, ta); bindT(1, tb); bindT(2, p.t);
  gl.uniform1i(P_COMP.u.uA, 0); gl.uniform1i(P_COMP.u.uB, 1); gl.uniform1i(P_COMP.u.uPrev, 2); gl.uniform1f(P_COMP.u.uMix, cur !== nxt ? mix : 0);

function go(i) { if (i === cur || cur !== nxt) return; nxt = i; mix = 0; status(); }
/* ---------------------------------------------------------------- the controls */
const sty = $('#styles'), pals = $('#pals'), trs = $('#tracks');
STYLES.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => { auto = false; $('#auto').setAttribute('aria-pressed', 'false'); go(i); }; sty.appendChild(b); });
PALS.forEach((n, i) => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { pal = i; status(); }; pals.appendChild(b); });
TRK.forEach((tr, k) => { const b = document.createElement('button'); b.innerHTML = `<i></i>T${k + 1} <span>${tr[0]}</span>`; b.onclick = () => { mute[k] ^= 1; b.classList.toggle('off', !!mute[k]); }; trs.appendChild(b); });

function status() {
  [...sty.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-pressed', String(i === nxt)));
  [...pals.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-pressed', String(i === pal)));
  $('#hint').textContent = STYLES[nxt].hint; document.body.classList.toggle('ink', pal === 2);
  $('#src').textContent = ext ? 'ARCHIVO · ' + ext : playing ? 'GROOVE DE PRUEBA · 116 BPM' : 'EN PAUSA';
}
$('#auto').onclick = (e) => { auto = !auto; e.currentTarget.setAttribute('aria-pressed', String(auto)); };
$('#sound').onclick = (e) => { audioOn(); AC.resume(); soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); };
$('#play').onclick = (e) => { playing = !playing; if (playing && fileSrc) { try { fileSrc.stop(); } catch (er) {} fileSrc = null; analyser = null; ext = null; } e.currentTarget.textContent = playing ? 'PAUSA' : 'GROOVE'; status(); };
$('#mutate').onclick = () => { S.seed = Math.random() * 100; rdMode = (rdMode + 1) % RD_MODES.length; S.hit = 1; };
$('#amt').oninput = (e) => { S.amt = e.target.value / 100; };
$('#trail').oninput = (e) => { trailK = e.target.value / 50; };
$('#file').onchange = (e) => { const f = e.target.files[0]; if (f) loadFile(f).catch(() => { $('#src').textContent = 'NO PUDE LEER ESE ARCHIVO'; }); };
let down = false;
function touch(ev) {
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width, y = 1 - (ev.clientY - r.top) / r.height, k = Math.min(5, Math.floor(x * 6));

}
cv.addEventListener('pointerdown', (e) => { down = true; touch(e); });
cv.addEventListener('pointermove', (e) => { if (down) { const r = cv.getBoundingClientRect(); S.touch = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height, 1]; } });
addEventListener('pointerup', () => { down = false; });
addEventListener('keydown', (e) => {
  const k = 'asdfgh'.indexOf(e.key.toLowerCase()); if (k >= 0) { hit(k, 1); voice(k, 0, Math.floor(stepN / 16)); }
  const s = '123456'.indexOf(e.key); if (s >= 0) { auto = false; $('#auto').setAttribute('aria-pressed', 'false'); go(s); }

addEventListener('resize', resize);
rdInit(); pInit(); resize(); status();
/* the film (tools/video/visuals_film.mjs): no clock of its own; each frame given its time, the tracks' levels, the styles */
window.filmFrame = (t, E, hit, a, b, m, p) => { S.t = t; for (let k = 0; k < 6; k++) S.E[k] = E[k]; S.hit = hit; cur = a; nxt = b; mix = m; pal = p || 0; draw(); };

else if (reduce) { for (let k = 0; k < 6; k++) S.E[k] = .4; frame(performance.now()); } else requestAnimationFrame(frame);

$('#toggle').onclick = (e) => { const f = document.querySelector('footer'); const hid = f.classList.toggle('hide'); e.currentTarget.setAttribute('aria-expanded', String(!hid)); };
if (PHONE) { document.querySelector('footer').classList.add('hide'); $('#toggle').setAttribute('aria-expanded', 'false'); }
</script>
